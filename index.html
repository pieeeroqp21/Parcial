<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Aplicación Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Encabezado y Navegación -->
  <header class="navbar">
    <div class="logo">TechStore</div>
    <nav>
      <a href="#inicio">Inicio</a>
      <a href="#catalogo">Catálogo</a>
      <button id="btn-ver-carrito" class="btn-cart">
        🛒 Carrito (<span id="cart-count">0</span>)
      </button>
    </nav>
  </header>

  <!-- Sección Inicio / Banner -->
  <section id="inicio" class="hero">
    <h1>Bienvenido a TechStore</h1>
    <p>Encuentra la mejor tecnología con precios actualizados en tiempo real.</p>
  </section>

  <!-- Filtros y Búsqueda -->
  <section class="controls-container">
    <input type="text" id="input-busqueda" placeholder="Buscar producto por nombre...">
    <select id="select-categoria">
      <option value="todas">Todas las categorías</option>
    </select>
  </section>

  <!-- Estados de carga y error -->
  <div id="loading" class="status-msg">Cargando productos desde la API...</div>
  <div id="error-msg" class="status-msg error hidden">Hubo un problema al cargar los datos. Intenta más tarde.</div>

  <!-- Catálogo de Productos -->
  <main id="catalogo" class="catalog-grid">
    <!-- Las tarjetas se generan dinámicamente con JavaScript -->
  </main>

  <!-- Modal de Detalle -->
  <div id="modal-detalle" class="modal hidden">
    <div class="modal-content">
      <span id="close-modal" class="close-btn">&times;</span>
      <div id="detalle-info"></div>
    </div>
  </div>

  <!-- Modal del Carrito -->
  <div id="modal-carrito" class="modal hidden">
    <div class="modal-content">
      <span id="close-carrito" class="close-btn">&times;</span>
      <h2>Tu Carrito de Compras</h2>
      <div id="lista-carrito"></div>
      <div class="cart-total">Total: S/ <span id="cart-total">0.00</span></div>
      <button id="btn-vaciar" class="btn-danger">Vaciar Carrito</button>
      <button id="btn-comprar" class="btn-success">Finalizar Pedido</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
